name: Replay candidate

on:
  push:
    branches: [main]
    tags: ["v*-candidate"]
  pull_request:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned dependency
        run: python -m pip install --requirement requirements.txt
      - name: Run complete normal and optimized replay
        run: python run_core_checks.py

