name: Replay candidate

on:
  push:
    branches: [main]
    tags: ["v*-candidate"]
  pull_request:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned dependency
        run: python -m pip install --requirement requirements.txt
      - name: Verify all-degree semantic receipts and negative controls
        run: python run_global_completion_checks.py --skip-engine-recompute
      - name: Verify complete v0.6 payload manifest and reader PDF
        run: |
          python tools/build_all_degree_release.py verify
          python tools/pdf_tex_preflight.py All-Degree-Low-Rank-Coefficient-Atlas.pdf
