name: Replay candidate

on:
  push:
    branches: [main]
    tags: ["v*-candidate"]
  pull_request:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned dependency
        run: python -m pip install --requirement requirements.txt
      - name: Verify all-degree semantic receipts and negative controls
        run: python run_global_completion_checks.py --skip-engine-recompute
      - name: Verify amplitude and Laurent semantic receipts and negative controls
        run: python run_amplitude_laurent_checks.py
      - name: Install document-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          npm ci
      - name: Verify combined reader paper and release integrity
        run: |
          python tools/check_combined_release.py
          python tools/build_combined_publication.py verify
          python tools/pdf_tex_preflight.py Inverse-Root-Support-Amplitudes-and-Laurent-Moments.pdf
